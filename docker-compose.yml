# Paperclip with the bakers-bridge plugin: `docker compose up`.
# A local bakers.build for the e2e tests and trying it out: `docker compose --profile bakers up`.
# Every value comes from .env (see .env.example and README › Configuration).
services:
  paperclip:
    # Paperclip v2026.1117.0, pinned by digest.
    image: ghcr.io/paperclipai/paperclip@sha256:bdf38d10544dc6c831e16dc027f23ad586353ef3be1a1b2c6979e63b956aceb1
    pids_limit: 2048
    stop_grace_period: 90s
    ports:
      - "${PAPERCLIP_PORT:-3100}:3100"
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "paperclip,${PAPERCLIP_ALLOWED_HOSTNAMES:-}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?PAPERCLIP_TOOL_ACTION_SIGNING_SECRET must be set}"
      # Requesters never see or change how agents run.
      PAPERCLIP_HIDDEN_SETTINGS: instance.adapters
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Or a Claude subscription token from `claude setup-token`.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
    volumes:
      - paperclip-data:/paperclip
      # This repository: the bakers-bridge plugin and the PM agent's instructions, config and skills.
      - .:/opt/bakers-paperclip:ro
      # Read-only, secret-free clones of the group's projects, the PM agent's code context.
      - "${PM_CLONES_DIR:-./data/clones}:/clones:ro"


  # A real bakers.build 0.14.1-next.13 (`next` at 5f9ff2fe, the first build with bb_webhook; its
  # standalone stack, images pinned by digest), profile `bakers`. A release tag replaces it later.
  # Reached as http://bakers.localhost:8080 from this machine and as http://bakers-gateway inside;
  # sign-in mails land in Mailpit on http://localhost:8125.
  bakers-init:
    profiles: [bakers]
    image: alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    command: sh -c "chown -R 1000:1000 /pf /privf /oauthkeys && chown 1000:1000 /tmpdir && chmod 1777 /tmpdir"
    volumes:
      - bakers-public:/pf
      - bakers-private:/privf
      - bakers-tmp:/tmpdir
      - bakers-oauth:/oauthkeys
    restart: "no"

  bakers-db:
    profiles: [bakers]
    image: wodby/mariadb:10.11-3.30.1@sha256:b9a55e5c1fceebc675e8733637336bed4ba7ac3d9f6447dfcf9545caaf56e81f
    environment:
      MYSQL_ROOT_PASSWORD: "${BAKERS_DB_ROOT_PASSWORD:?BAKERS_DB_ROOT_PASSWORD must be set}"
      MYSQL_DATABASE: bakers
      MYSQL_USER: bakers
      MYSQL_PASSWORD: "${BAKERS_DB_PASSWORD:?BAKERS_DB_PASSWORD must be set}"
    volumes:
      - bakers-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  bakers-deploy: &bakers-app
    profiles: [bakers]
    image: ghcr.io/bakers-build/bakers-build/php:next@sha256:4b20fdb969db7942a7473a426926b1f905c85f639e0d824733a069b285a55faa
    depends_on:
      bakers-init:
        condition: service_completed_successfully
      bakers-db:
        condition: service_healthy
    environment: &bakers-env
      DB_HOST: bakers-db
      DB_NAME: bakers
      DB_USER: bakers
      DB_PASSWORD: "${BAKERS_DB_PASSWORD}"
      DB_DRIVER: mysql
      DB_PORT: "3306"
      DOMAIN: bakers.localhost
      DRUSH_OPTIONS_URI: http://bakers.localhost:8080
      DRUPAL_HASH_SALT: "${BAKERS_HASH_SALT:?BAKERS_HASH_SALT must be set}"
      MAIL_SMTP_DSN: smtp://mailpit:1025
      MAIL_FROM_ADDRESS: bakers@bakers.localhost
      ADMIN_EMAIL: "${BAKERS_ADMIN_EMAIL:-admin@bakers.localhost}"
      FEATURE_FLAG_RUN_LOG_STORAGE: "0"
    volumes:
      - bakers-public:/var/www/html/web/sites/default/files
      - bakers-private:/var/www/html/private-files
      - bakers-tmp:/tmp
      - bakers-oauth:/var/www/oauth-keys
    # Installs into the empty database on the first start, runs the updates on every later one.
    command: /var/www/html/scripts/deploy/site-deploy.sh
    restart: "no"

  bakers-php:
    <<: *bakers-app
    depends_on:
      bakers-deploy:
        condition: service_completed_successfully
    environment:
      <<: *bakers-env
      PHP_FPM_USER: wodby
      PHP_FPM_GROUP: wodby
      PHP_FPM_CLEAR_ENV: "no"
    command: []
    restart: unless-stopped
    # The nginx image reaches PHP by this name.
    networks:
      default:
        aliases: [php]

  bakers-cron:
    <<: *bakers-app
    depends_on:
      bakers-deploy:
        condition: service_completed_successfully
    environment:
      <<: *bakers-env
      # Webhook deliveries go out on cron: every 10 s, so the e2e tests see them within seconds.
      CRON_INTERVAL: "10"
    command: /var/www/html/scripts/deploy/site-cron.sh
    restart: unless-stopped

  bakers:
    profiles: [bakers]
    image: ghcr.io/bakers-build/bakers-build/nginx:next@sha256:d5901d334fa5ce979d8d14d8cb34956259cec608b24d371ef832d1c4571613e5
    depends_on: [bakers-php]
    environment:
      NGINX_BACKEND_HOST: php
      NGINX_SERVER_ROOT: /var/www/html/web
      NGINX_VHOST_PRESET: drupal10
      NGINX_STATIC_OPEN_FILE_CACHE: "off"
      NGINX_SERVER_EXTRA_CONF_FILEPATH: /etc/nginx/oauth-discovery.conf
    volumes:
      - bakers-public:/var/www/html/web/sites/default/files
    ports:
      - "127.0.0.1:8080:80"

  # How Paperclip, its agents and the bridge reach bakers.build: http://bakers-gateway. Claude's CLI
  # resolves every *.localhost name to itself, and bakers.build answers to DOMAIN only, so this
  # proxy calls it with that host; its ticket links then open on this machine.
  bakers-gateway:
    profiles: [bakers]
    image: nginx:1.29.3-alpine@sha256:b3c656d55d7ad751196f21b7fd2e8d4da9cb430e32f646adcf92441b72f82b14
    depends_on: [bakers]
    configs:
      - source: bakers-gateway
        target: /etc/nginx/conf.d/default.conf

  mailpit:
    profiles: [bakers]
    image: axllent/mailpit:v1.27.0@sha256:fb84cfb1c3a33007cfdee8ba5a77b8c6c894de5b1a368372ddc5c965cf5c0b6d
    ports:
      - "127.0.0.1:8125:8025"

configs:
  bakers-gateway:
    content: |
      server {
        listen 80;
        location / {
          proxy_pass http://bakers:80;
          proxy_http_version 1.1;
          proxy_set_header Host bakers.localhost:8080;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_read_timeout 300s;
        }
      }

volumes:
  paperclip-data:
  bakers-db:
  bakers-public:
  bakers-private:
  bakers-tmp:
  bakers-oauth:
